server {
    listen 80;
    listen [::]:80;
    server_name www.surreality.world;

    return 301 http://surreality.world$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name surreality.world;

    root /var/www/surreality-world/current;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
